<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 256,36 L 436,80 L 436,260 C 436,360 350,435 256,476 C 162,435 76,360 76,260 L 76,80 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Dark Core Shield -->
  <path d="M 256,70 L 406,106 L 406,252 C 406,338 332,404 256,440 C 180,404 106,338 106,252 L 106,106 Z" 
        fill="#0F172A" stroke="#0369A1" stroke-width="4"/>

  <!-- Radar / Magnifying Security Ring -->
  <circle cx="256" cy="240" r="76" fill="none" stroke="#38BDF8" stroke-width="8" stroke-dasharray="10 6"/>
  <circle cx="256" cy="240" r="54" fill="#1E293B" stroke="#0284C7" stroke-width="4"/>

  <!-- Validated Security Checkmark -->
  <path d="M 220,240 L 246,266 L 298,206" fill="none" stroke="url(#checkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
